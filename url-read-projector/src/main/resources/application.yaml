spring:
  application:
    name: url-read-projector
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    function:
      definition: handleUrlCreatedEvent
    stream:
      bindings:
        handleUrlCreatedEvent-in-0:
          destination: urls
          group: url-read-projector-group
  server:
    port: 8085
